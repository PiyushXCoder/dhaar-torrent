<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 288" width="720" height="288" role="img" aria-label="Download rate compared with available link capacity: link allows 9.9 megabytes per second, the client's own ceiling is 4.3, a live swarm reaches 2.5, and a single HTTP stream gets 0.5">
  <title>What we get versus what the link allows</title>
  <desc>Link capacity 9.9 MB/s measured with 8 parallel HTTP streams. dhaar reaches 2.5 MB/s on a live swarm, against its own no-network ceiling of 4.3 MB/s. A single HTTP stream from the same mirror gets 0.5 MB/s.</desc>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="16" y="26" font-size="15" font-weight="600" fill="#7d8590">What we get versus what the link allows</text>
    <text x="16" y="44" font-size="11.5" fill="#7d8590" opacity="0.85">Same machine, same afternoon, megabytes per second</text>

    <!-- gridlines -->
    <g stroke="#7d8590" stroke-opacity="0.2" stroke-width="1">
      <line x1="210" y1="58" x2="210" y2="216"/>
      <line x1="304" y1="58" x2="304" y2="216"/>
      <line x1="398" y1="58" x2="398" y2="216"/>
      <line x1="492" y1="58" x2="492" y2="216"/>
      <line x1="586" y1="58" x2="586" y2="216"/>
      <line x1="680" y1="58" x2="680" y2="216"/>
    </g>
    <g font-size="10.5" fill="#7d8590" opacity="0.75" text-anchor="middle">
      <text x="210" y="232">0</text>
      <text x="304" y="232">2</text>
      <text x="398" y="232">4</text>
      <text x="492" y="232">6</text>
      <text x="586" y="232">8</text>
      <text x="680" y="232">10 MB/s</text>
    </g>

    <!-- the headroom we are not using -->
    <rect x="327.5" y="58" width="337.8" height="158" fill="#f0883e" fill-opacity="0.07"/>
    <line x1="327.5" y1="58" x2="327.5" y2="216" stroke="#f0883e" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="496" y="210" font-size="11" font-weight="600" fill="#f0883e" fill-opacity="0.85" text-anchor="middle">4x headroom unused</text>

    <!-- labels -->
    <g font-size="12" fill="#7d8590">
      <text x="198" y="82" text-anchor="end">What the link allows</text>
      <text x="198" y="120" text-anchor="end">dhaar, own ceiling</text>
      <text x="198" y="158" text-anchor="end">dhaar, live swarm</text>
      <text x="198" y="196" text-anchor="end">One HTTP stream</text>
    </g>

    <!-- bars -->
    <rect x="210" y="66" width="465.3" height="24" rx="3" fill="#58a6ff"/>
    <rect x="210" y="104" width="202.1" height="24" rx="3" fill="#f0883e" fill-opacity="0.4"/>
    <rect x="210" y="142" width="117.5" height="24" rx="3" fill="#f0883e"/>
    <rect x="210" y="180" width="23.5" height="24" rx="3" fill="#7d8590" fill-opacity="0.45"/>

    <!-- values -->
    <g font-size="11.5" font-weight="600" fill="#7d8590">
      <text x="685.3" y="82">9.9</text>
      <text x="422.1" y="120">4.3</text>
      <text x="337.5" y="158">2.5</text>
      <text x="243.5" y="196">0.5</text>
    </g>

    <!-- caveats, said on the chart rather than only in prose -->
    <g font-size="10.5" fill="#7d8590" opacity="0.8">
      <text x="210" y="256">Link measured with 8 parallel streams to one mirror — a floor on capacity, not a ceiling.</text>
      <text x="210" y="272">Own ceiling is two instances over loopback: no network, warm cache. Live swarm varies ±20%.</text>
    </g>

  </g>
</svg>
