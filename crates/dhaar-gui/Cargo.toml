[package]
name = "dhaar-gui"
version = "0.1.0"
edition = "2024"
description = "A desktop BitTorrent client built on dhaar-torrent"
license = "MIT"
repository = "https://github.com/PiyushXCoder/dhaar-torrent"
keywords = ["bittorrent", "torrent", "p2p", "gui", "client"]
categories = ["network-programming", "gui"]

[dependencies]
dhaar-torrent = { version = "0.4.0", path = "../.." }
iced = { version = "0.14.0", features = ["tokio"] }
rfd = "0.17.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }
