[workspace]
members = [
    ".",
    "crates/*",
]

resolver = "3"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["display"] }
num-traits = { version = "0.2.19", features = ["i128"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[package]
name = "dhaar-torrent"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
bencode = { path = "crates/bencode" }
chrono = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
derive_more = { workspace = true }
futures = "0.3.34"
home-config = "0.7.0"
merge = "0.2.0"
num-traits = { workspace = true }
rand = "0.10.1"
reqwest = { version = "0.13.4", features = ["query"] }
serde = { workspace = true }
serde_bytes = "0.11.19"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = { workspace = true }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
# Optional: the tokio-console telemetry layer. Off by default because it
# needs the whole crate built with `--cfg tokio_unstable`, which is not a
# thing to impose on an ordinary build. See `scripts/console.sh`.
console-subscriber = { version = "0.5.0", optional = true }

[features]
# Task-level telemetry for `tokio-console`. `tokio/tracing` is what makes the
# runtime emit per-task spans; without it the console connects and shows
# nothing.
console = ["dep:console-subscriber", "tokio/tracing"]

[dev-dependencies]
divan = "0.1.21"
husky-rs = "0.3.3"

[[bench]]
name = "piece_writer"
harness = false

# Optimised like `release`, but keeps the symbols a profiler needs to name a
# frame. Measuring a debug build answers a question nobody asked: it is the
# same code with the optimiser switched off, and the shape of where the time
# goes is not the same shape.
#
# A separate profile rather than `debug = true` on `release` so that
# `target/release` stays exactly what `scripts/bench-seeders.sh` measures, and
# so a profiling build and an ordinary one do not keep invalidating each other.
[profile.profiling]
inherits = "release"
debug = true
